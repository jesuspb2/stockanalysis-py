[project]
name = "stockanalysis-py"
version = "0.1.0"
description = "Python library for extracting data from stockanalysis.com"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
auth = [
    "playwright>=1.40",
]

[project.scripts]
stockanalysis-login = "stockanalysis.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockanalysis"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]
