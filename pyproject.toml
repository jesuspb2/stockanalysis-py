[project]
name = "stockanalysis-py"
version = "0.1.0"
description = "Python library for extracting data from stockanalysis.com"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
auth = [
    "playwright>=1.40",
]

[project.scripts]
stockanalysis-login = "stockanalysis.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockanalysis"]

[tool.mypy]
python_version = "3.10"
strict = false

[[tool.mypy.overrides]]
module = ["pandas.*", "playwright.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.13",
]
