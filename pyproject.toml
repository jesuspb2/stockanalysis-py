[project]
name = "stockanalysis-py"
version = "0.1.0"
description = "Python library for extracting data from stockanalysis.com"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jesus", email = "jesuspb2@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/jesuspb2/stockanalysis-py"
Repository = "https://github.com/jesuspb2/stockanalysis-py"

[project.optional-dependencies]
auth = [
    "playwright>=1.40",
]

[project.scripts]
stockanalysis-login = "stockanalysis.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockanalysis"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live network connection",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.13",
]
